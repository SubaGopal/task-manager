<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-content">
        <h1>Task Manager</h1>
        <p class="subtitle">Organize, track, and complete your tasks</p>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="btn-theme" title="Toggle Dark/Light Mode">🌙</button>
      </div>
    </header>

    <!-- Dashboard Analytics -->
    <section class="dashboard-grid">
      <div class="stat-card" data-filter="ALL" title="Click to view all tasks">
        <div class="stat-icon icon-total">📋</div>
        <div class="stat-info">
          <span class="stat-label">Total Tasks</span>
          <span class="stat-value" id="stat-total">0</span>
        </div>
      </div>
      <div class="stat-card" data-filter="PENDING" title="Click to view pending tasks">
        <div class="stat-icon icon-pending">⏳</div>
        <div class="stat-info">
          <span class="stat-label">Pending</span>
          <span class="stat-value" id="stat-pending">0</span>
        </div>
      </div>
      <div class="stat-card" data-filter="COMPLETED" title="Click to view completed tasks">
        <div class="stat-icon icon-completed">✅</div>
        <div class="stat-info">
          <span class="stat-label">Completed</span>
          <span class="stat-value" id="stat-completed">0</span>
        </div>
      </div>
      <div class="stat-card" data-filter="OVERDUE" title="Click to view overdue tasks">
        <div class="stat-icon icon-overdue">🚨</div>
        <div class="stat-info">
          <span class="stat-label">Overdue</span>
          <span class="stat-value" id="stat-overdue">0</span>
        </div>
      </div>
    </section>

    <!-- Live Progress Bar -->
    <section class="progress-section card">
      <div class="progress-header">
        <span class="progress-title">Productivity Progress</span>
        <span class="progress-percent" id="progress-text">0% Completed</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
      </div>
    </section>

    <div id="toast" class="toast hidden"></div>

    <main class="main-layout">
      <!-- Left Column: Form -->
      <section class="card form-card">
        <h2 id="form-title">Create New Task</h2>
        <form id="task-form">
          <input type="hidden" id="task-id">

          <div class="form-group">
            <label for="title">Title <span class="required">*</span></label>
            <input type="text" id="title" name="title" placeholder="e.g. Launch new website" required maxlength="100">
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="2" placeholder="Additional details..." maxlength="1000"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group col">
              <label for="category">Category</label>
              <select id="category" name="category">
                <option value="WORK">💼 Work</option>
                <option value="PERSONAL" selected>🏠 Personal</option>
                <option value="STUDY">📚 Study</option>
                <option value="HEALTH">🏃 Health</option>
                <option value="FINANCE">💰 Finance</option>
                <option value="OTHER">🔖 Other</option>
              </select>
            </div>

            <div class="form-group col">
              <label for="priority">Priority</label>
              <select id="priority" name="priority">
                <option value="LOW">Low</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="HIGH">High</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="dueDate">Due Date</label>
            <input type="date" id="dueDate" name="dueDate">
          </div>

          <!-- Subtasks Builder inside Form -->
          <div class="form-group subtasks-builder">
            <label>Subtasks Checklist</label>
            <div class="subtask-input-row">
              <input type="text" id="new-subtask-input" placeholder="Add a checklist item...">
              <button type="button" id="add-subtask-btn" class="btn btn-secondary btn-sm">+ Add</button>
            </div>
            <ul id="form-subtask-list" class="form-subtask-list"></ul>
          </div>

          <div class="form-actions">
            <button type="submit" id="save-btn" class="btn btn-primary">Save Task</button>
            <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Cancel</button>
          </div>
        </form>
      </section>

      <!-- Right Column: List & Filters -->
      <section class="tasks-section">
        <div class="controls-card">
          <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search tasks by title...">
          </div>
          
          <div class="filter-controls">
            <div class="filter-group">
              <label for="filter-category">Category:</label>
              <select id="filter-category">
                <option value="">All</option>
                <option value="WORK">💼 Work</option>
                <option value="PERSONAL">🏠 Personal</option>
                <option value="STUDY">📚 Study</option>
                <option value="HEALTH">🏃 Health</option>
                <option value="FINANCE">💰 Finance</option>
                <option value="OTHER">🔖 Other</option>
              </select>
            </div>

            <div class="filter-group">
              <label for="filter-status">Status:</label>
              <select id="filter-status">
                <option value="">All</option>
                <option value="PENDING">Pending</option>
                <option value="COMPLETED">Completed</option>
              </select>
            </div>

            <div class="filter-group">
              <label for="filter-priority">Priority:</label>
              <select id="filter-priority">
                <option value="">All</option>
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
              </select>
            </div>

            <div class="filter-group">
              <label for="sort-by">Sort By:</label>
              <select id="sort-by">
                <option value="createdAt-desc">Newest First</option>
                <option value="createdAt-asc">Oldest First</option>
                <option value="dueDate-asc">Due Date (Soonest)</option>
                <option value="priority-desc">Priority</option>
              </select>
            </div>
          </div>
        </div>

        <div id="loading" class="loading-state hidden">Loading tasks...</div>
        <div id="task-list" class="task-list"></div>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
